
  - name: Install mysql
    ansible.builtin.dnf:
      name: mysql-server
      state: present

  - name: Enable and Start the Service
    ansible.builtin.service:
      name: mysqld
      enabled: yes
      state: restarted

  # - name: Install dependencies for mysql
  #   ansible.builtin.pip:
  #     name: "{{ item }}"
  #   loop: 
  #     - PyMySQL

  - name: setup root password
    ansible.builtin.command: mysql_secure_installation --set-root-pass "{{ mysql_password }}"