
    - name: Install maven 
      ansible.builtin.dnf:
        name: maven 
        state: present
    
    - name: Create roboshop user 
      ansible.builtin.import_role:
       name: common 
       tasks_from: roboshop_user.yaml
    
    - name: delete and get the {{ component }} code 
      ansible.builtin.import_role: 
       name: common 
       tasks_from: app_code.yaml
     

    - name: change dir to /app and run mvn clean package
      ansible.builtin.command:  mvn clean package 
      args:
         chdir: /app

    - name: copy file from target/shipping-1.0.jar shipping.jar 
      ansible.builtin.copy:
        src: /app/target/shipping-1.0.jar
        dest: /app/shipping.jar
        remote_src: yes
    

       
    - name: Install mysql 
      ansible.builtin.dnf: 
        name: mysql 
        state: present

    - name: Install dependencies for mysql
      ansible.builtin.pip:
        name: "{{ item }}"
      loop: 
      - PyMySQL

    - name: Create target database if it does not exist
      community.mysql.mysql_db:
         name: all
         login_host: "{{ sql_hostname }}"
         login_user: "{{ mysql_user }}"
         login_password: "{{ mysql_password }}"
         state: import 
         target: "{{ item }}"
      loop:
            - /app/db/schema.sql
            - /app/db/app-user.sql 
            - /app/db/master-data.sql
   
    - name: reload and start {{ component }} service 
      ansible.builtin.import_role: 
        name: common 
        tasks_from: systemd_service.yaml

  